# tier.py configuration — copy to tiering.yaml and fill in plex.token.
#
# Container install:   /mnt/user/appdata/plex-media-tiering/tiering.yaml  (mounted as /config/tiering.yaml)
# Bare install:        /boot/config/plugins/user.scripts/scripts/plex-media-tiering/tiering.yaml
#
# Plex token: see https://support.plex.tv/articles/204059436-finding-an-authentication-token-x-plex-token/
# Generate once, paste below. Keep this file mode 600.

plex:
  url: "http://localhost:32400"
  token: "REPLACE_WITH_YOUR_PLEX_TOKEN"

libraries:
  # Names MUST match your Plex library names exactly (case-sensitive).
  # Add one entry per library you want scored. Mix movie and TV libraries
  # freely — the script detects type via Plex and picks the right path.
  - name: "Movies"
  - name: "TV Shows"
  # - name: "4K Movies"
  # - name: "Anime"
  # - name: "Kids"

thresholds:
  # WARM -> HOT when score rises above this
  score_to_hot: 40.0
  # HOT -> WARM when score drops below this
  # (dead zone between the two prevents flapping)
  score_to_warm: 20.0
  # Never-watched items get HOT protection until they're this old
  age_grace_days: 180
  # Recency decay half-life for play weight
  recency_half_life_days: 90
  # Recency floor — any item watched within this window stays HOT
  # regardless of raw score. Stops infrequent-but-current shows (e.g.
  # show with one episode every few weeks) from being demoted just
  # because the play count is low. Set to 0 or comment out to disable.
  hot_recency_days: 730   # ~2 years
  # Added-date floor — items added to Plex within this window are
  # promoted to HOT even if never watched. Plex surfaces recently-added
  # media on the home screen for roughly this long; tier them accordingly.
  # TV floor fires when ANY episode in the show was added within the
  # window (catches currently-airing shows whose show-level addedAt is
  # old). Set to 0 or null to disable.
  added_floor_days_movies: 45   # movies added within 45 days -> HOT
  added_floor_days_tv: 30       # TV show with episode added within 30 days -> HOT

# Pinning — overrides that force items to HOT regardless of score.
# Both lists are case-insensitive. Library matching is exact; title
# matching is substring (so "Stargate" pins SG-1, Atlantis, Universe,
# Origins, and the movie). Pinned items show outcome=PIN_HOT.
pinning:
  always_hot_libraries:
    # Examples — uncomment to enable:
    # - "4K Movies"              # whole 4K library stays on the hot pool
  always_hot_titles:
    # Examples — uncomment to enable:
    # - "The Expanse"            # any title containing 'the expanse'
    # - "Stargate"               # catches SG-1, Atlantis, Universe, etc.

# Collection pinning — force every member of a named Plex collection to HOT
# regardless of score. Each entry needs both a library name (case-sensitive,
# must match Plex exactly) and a collection name (case-insensitive exact match).
# Members show outcome=PIN_HOT. Empty list disables this feature.
pinned_collections: []
  # Examples — uncomment to enable:
  # - library: "Movies"
  #   name: "Marvel Cinematic Universe"   # whole MCU collection -> HOT
  # - library: "Movies"
  #   name: "Star Wars"
  # - library: "TV Shows"
  #   name: "Must Watch"                  # a manual "keep hot" collection

# Auto-inherit collection pin — automatically promote every member of a Plex
# collection to HOT when at least min_hot_members of its members naturally score
# at or above score_to_hot (pre-floor, pre-pin). Use case: you've watched
# enough Star Wars films that they score hot; the rest of the collection
# auto-inherits HOT so they're ready when you reach for them.
# Default: disabled — opt-in once you've confirmed your scoring looks sane.
auto_collection_inherit:
  enabled: false
  min_hot_members: 2          # collections with fewer members than this are skipped entirely
  # Escape hatch for collections sized exactly equal to min_hot_members. When
  # collection_size == min_hot_members, require this fraction of members to be
  # hot (ceil, floored at 1) instead of the absolute count. For larger
  # collections the absolute min_hot_members threshold still applies.
  # Default 0.5 means a 2-member collection needs 1 hot member to trigger.
  min_hot_fraction: 0.5
  skip_smart_collections: true  # smart (rules-based) collections are already curated — skip
  exclude_libraries: []       # library names to exempt from auto-inherit entirely
  # - "DVD Rips"              # example: low-quality library you never want auto-pinned

# Human-readable rotating log. In the container, /config is a bind-mount to
# /mnt/user/appdata/plex-media-tiering, so the log is readable from the Unraid GUI's
# file manager or any SMB mount.
logging:
  path: "/config/tier.log"
  level: "INFO"           # DEBUG | INFO | WARNING | ERROR
  max_bytes: 2000000      # 2 MB per file before rotating
  backup_count: 5         # keep 5 rotated files (tier.log.1 .. tier.log.5)

# Alerting — at least one of these should be configured so you get notified
# when the Plex token is rejected or the script crashes.
notifications:
  # Generic JSON webhook (Home Assistant, gotify, ntfy, Discord relay, etc.).
  # Leave url null to disable. The POST body is:
  #   {source, level, title, message, timestamp}
  webhook:
    url: null
    auth_header: null     # e.g. "Bearer ntfy-token" or "Basic <base64>"

  # Unraid's built-in notifier (shows in the GUI bell + configured agents).
  # Container installs must bind-mount the notify script path in, OR set
  # this to false and rely on the webhook instead.
  unraid:
    enabled: false
    notify_script: "/usr/local/emhttp/webGui/scripts/notify"

  # Which conditions should fire an alert
  on_plex_unreachable: true
  on_auth_failure: true
  on_script_error: true

# Paths — used by P1 (tier detection) and P2 (moves). Tier detection
# activates automatically when hot_pool_mount is set AND at least one
# array disk is known (explicit or auto-detected). If either is missing,
# the script falls back to P0 behaviour (SHOULD_BE_* outcomes).
paths:
  user_share_prefix: "/mnt/user"
  # Mount point of your HOT pool as tier.py sees it. ZFS pool, separate
  # SSD cache, dedicated NVMe — whatever your "fast tier" lives on.
  # Must be bind-mounted into the container.
  hot_pool_mount: "/mnt/hot_pool"
  # Array disks (WARM tier) as tier.py sees them. Empty list = auto-
  # detect every /mnt/disk[0-9]* that is an actual mount point visible
  # to the container. Populate explicitly to restrict the set.
  array_disks: []
  # Disks to exclude from auto-detection. Useful for retiring drives
  # that should not accept new writes.
  array_disk_exclude: []
  #   - "/mnt/disk7"   # example: drive being retired
  # Plex-to-tier filesystem path translation.
  # Plex reports file paths as IT sees them. If Plex runs in a
  # different container / VM / host than tier.py, those paths won't
  # resolve locally. List longest-first; the matching plex prefix is
  # replaced with the corresponding tier prefix.
  plex_path_map: []
  #   - plex: "/data/movies"   # what Plex reports
  #     tier: "/mnt/user/Movies"  # where tier.py can actually see it
  #   - plex: "/data/tv"
  #     tier: "/mnt/user/TV Shows"

# Disk eviction — mark specific warm-tier array disks as evicting so items
# on them are flagged for relocation regardless of their tier score. Typical
# use cases: a disk developing reallocated sectors that needs to retire, a
# disk with cabling issues you want to drain before debugging, or a
# rebalance across the array. Eviction is orthogonal to the hot/warm tier
# decision: an item being evicted isn't necessarily wrong-tiered, its
# current *disk* is just unacceptable. Items that would STAY_WARM on an
# evicting disk instead show RELOCATE_WARM in the report, signalling that
# P2's mover should move them to a different warm disk. Items already
# heading to HOT (TO_HOT) resolve the eviction implicitly — no new outcome.
#
# IMPORTANT: Eviction does not move data — it flags items so the dry-run
# report shows what would move when P2's mover lands.
#
# Disk paths must match the format used in paths.array_disks exactly
# (case-sensitive). A typo logs a WARNING and is skipped; the run continues.
array_disk_evict:
  enabled: false
  disks: []
  # - "/mnt/disk7"   # disk developing bad sectors — drain before retirement
  # - "/mnt/disk2"   # cabling issues — drain before debug

# Move executor (P2.1) — controls rsync moves from WARM array to HOT pool.
#
# Default: enabled=false — the move pass is skipped entirely (no log lines).
# Set enabled=true to activate dry-run reporting. Add --apply on the CLI to
# actually execute moves. Scope: TO_HOT only in P2.1.
#
# Recommended first-run sequence:
#   1. Set enabled=true, leave --apply off. Confirm the dry-run list looks sane.
#   2. Set delete_source_after_verify=false. Run with --apply on one test item.
#      Confirm the destination has the file and source is untouched.
#   3. Set delete_source_after_verify=true when you trust the verify step.
moves:
  enabled: false
  # Set apply: true to execute moves without passing --apply on the CLI.
  # Useful for scheduled runs (e.g. Unraid User Scripts) where you can't
  # append CLI flags. Equivalent to --apply; both flags are additive.
  apply: false
  # rsync flags applied to every move. -aH preserves permissions, timestamps,
  # and hardlinks. --partial keeps partial transfers so a restart doesn't start
  # from zero. --inplace writes directly to the destination file.
  rsync_options: ["-aH", "--partial", "--inplace"]
  # Delete the source directory after rsync exits 0 AND size-verify passes.
  # Set false for the first few apply runs to keep the source as a safety net.
  delete_source_after_verify: true
  # Verify destination byte count matches source within 1 KB before deleting.
  # Strongly recommended — disabling skips the only safety gate before delete.
  size_verify: true
  # Abort the move pass if an Unraid parity check or resync is in progress.
  # Parity recalculation is sensitive to concurrent writes; blocking is safest.
  # Set false if you need an escape hatch and understand the risk.
  parity_check_blocking: true
  # Throttle rsync to this many MB/s. null = unthrottled. Useful if you want
  # moves to run in the background without saturating the array.
  bandwidth_limit_mbps: null
  # - 50    # example: cap at 50 MB/s
  # Throughput estimates used for the ETA shown at the start of each run.
  # TO_HOT writes to the ZFS/NVMe hot pool (typically fast).
  # TO_WARM and RELOCATE_WARM write to spinning-disk array (typically slower).
  # Adjust to reflect your actual hardware if the ETA is consistently off.
  estimated_hot_mbps: 200
  estimated_warm_mbps: 50
  # Destination warm-disk selection for TO_WARM and RELOCATE_WARM moves.
  warm_disk_selection:
    # Only strategy in v1. For each item needing a warm destination:
    #   1. Filter disks by free space >= item size + safety_margin_gb.
    #   2. For series: prefer the disk that already holds the most bytes
    #      of that series (co-location keeps a show on one spindle).
    #   3. Fallback: most free space wins.
    # Items with no qualifying disk are skipped with [FAILED] in the log.
    strategy: "co_locate_then_most_free"
    # Minimum free space to leave on the target disk after the move (GB).
    # Conservative: a fully accurate check would subtract existing series
    # bytes already on the target, but the simple upper-bound is safer.
    safety_margin_gb: 50
  # Stop the move pass once this many GB have been successfully transferred in a
  # single run (0 = no limit). Remaining items are left in place and reconsidered
  # next run. Useful for bounding run time on slow array disks or active hours.
  # Distinct from capacity.hot_ceiling_percent — that guards pool fill level;
  # this guards run duration.
  # Example: 200
  max_total_move_gb: 0

# Capacity-aware tiering (P3) — keeps the hot ZFS pool under a fill ceiling
# and optionally demotes lowest-scoring items when the pool is already over.
#
# How the promotion budget works:
#   budget = (hot_ceiling_percent / 100 × pool_total) - pool_used - safety_margin
#   TO_HOT candidates are sorted by score descending; each item is allocated
#   from the budget in order. Items that don't fit become OVER_BUDGET_HOT
#   (they stay warm this run and try again next time as scores evolve).
#   If the budget is zero or negative, ALL TO_HOT items are deferred.
#
# Dry-run output includes a Capacity: section before the move table:
#   Capacity: hot pool 39% full (24.9 / 63.8 TB) — budget 26.1 TB to 80% ceiling
#   Capacity: 47 TO_HOT candidates totalling 3.4 TB — fitting 24, 23 deferred
#   Capacity: warm disk /mnt/disk1 — 4.2 / 8.0 TB (53%)
#   Capacity: warm disk /mnt/disk2 — 7.6 / 8.0 TB (95%)  ← over 90% ceiling
capacity:
  # Refuse to fill the hot ZFS pool past this percentage.
  # ZFS write performance degrades above ~80%; snapshots need headroom too.
  hot_ceiling_percent: 80

  # Skip warm array disks that are already at or above this fill level when
  # selecting a destination for TO_WARM and RELOCATE_WARM moves. An over-
  # ceiling disk is simply excluded from candidates; if no disks qualify the
  # item is logged as [FAILED] and left in place until space frees up.
  warm_per_disk_ceiling_percent: 90

  # When true and the hot pool is already over the ceiling, auto-demote the
  # lowest-scoring STAY_HOT items to TO_WARM until the pool would come back
  # under the ceiling. PIN_HOT items (library/title/collection pins) are
  # always exempt — never demote an explicit pin.
  # Default: false — opt-in once you've confirmed the ceiling is set correctly.
  auto_demote_when_over_ceiling: false

  # Extra headroom to reserve inside the ceiling (GB). Useful to account for
  # snapshot growth or concurrent in-progress downloads during the run.
  # Set to 0 to use the ceiling as the hard limit with no extra margin.
  budget_safety_margin_gb: 0
  # - 100   # example: keep an extra 100 GB back from the ceiling

  # --- Hot pool capacity detection ---
  #
  # tier.py needs accurate ZFS pool stats (total/used). statvfs inside Docker
  # returns used=0 when all files live in ZFS child datasets — symptom is
  # "0% full" in the Capacity log. Configure ONE of the two options below.
  #
  # Detection priority (first success wins):
  #   1. Unraid Connect GraphQL API  ← configure below if you have an API key
  #   2. 'zpool' command             ← works if ZFS tools happen to be installed
  #   3. /proc/spl kstat             ← works with: --volume /proc/spl:/proc/spl:ro
  #   4. hot_pool_total_gb override  ← configure below as a simpler fallback
  #   5. statvfs                     ← WARNING logged when used=0 (unreliable for ZFS)

  # Option A — Unraid Connect GraphQL API (Unraid 6.12+).
  # Get an API key: Unraid UI → Settings → Management Access → API Keys → New Key.
  # The URL is your Unraid host IP on port 80 (or 443 if HTTPS is enabled).
  # Advantage: fully automatic, no pool-name config needed in most cases.
  # Network note: the tiering container must be able to reach the Unraid host to use
  # this option. If Plex runs on a macvlan/ipvlan-L2 network, a single macvlan/ipvlan
  # interface cannot reach the host. Use the dual-home pattern described in the README
  # "Deployment & networking" section, or switch to Option B instead.
  unraid_api_url: null       # e.g. "https://192.0.2.10/graphql"  (must be https)
  unraid_api_key: null       # API key string from the Unraid UI
  unraid_pool_name: null     # ZFS pool name (e.g. "Zfs_media"); auto-matched if null
  unraid_api_verify_tls: true  # set false for Unraid's self-signed cert on a trusted LAN; see README

  # Option B — manual pool size override.
  # Advantage: no API key needed; works everywhere; requires one-time config.
  # Run the commands below on the Unraid host to find your pool size.
  # Replace /mnt/hot_pool with your paths.hot_pool_mount value:
  #
  #   # Step 1 — find ZFS pool name from the mount point:
  #   awk '$2=="/mnt/hot_pool" && $3=="zfs" {split($1,a,"/"); print a[1]; exit}' /proc/mounts
  #
  #   # Step 2 — get USABLE size in GiB (accounts for RAIDZ parity overhead).
  #   # Use 'zfs get' (ZFS dataset layer) — 'zpool list' size/alloc/free are raw
  #   # vdev bytes and do NOT reflect parity overhead. Replace Zfs_media below:
  #   zfs get -Hp -o value available,used Zfs_media | awk '{s+=$1} END {printf "%d\n", s/1024/1024/1024}'
  #
  #   # Or as a single command:
  #   POOL=$(awk '$2=="/mnt/hot_pool" && $3=="zfs" {split($1,a,"/"); print a[1]; exit}' /proc/mounts) \
  #     && zfs get -Hp -o value available,used $POOL \
  #     | awk -v p="$POOL" '{s+=$1} END {printf "%d (%s)\n", s/1024/1024/1024, p}'
  #
  # Update this value if you expand the pool (add vdevs / replace drives).
  hot_pool_total_gb: null
  # hot_pool_total_gb: 65536                     # example: 64 TB (64 × 1024 GB)

# Scheduling primitives (P4.1) — makes tier.py safe to run from cron.
# All state files (lock, last_run.json) live in /config/state/ and are
# created automatically; no manual setup required.
scheduling:
  # Skip this run if the previous run finished within this many minutes.
  # 0 = disabled (always run). Set to e.g. 50 when a monthly cron and a
  # manual trigger could fire within the same hour — only the first run
  # executes, the second exits quietly with code 6 (SKIPPED_RECENT).
  skip_if_run_within_minutes: 0

  # Default run mode when neither --mode nor TIER_MODE is set.
  # One of: full, promote-only, demote-only. See README "Run modes".
  default_mode: full
  # default_mode: promote-only             # example: daily fast-cadence container

  # On promote-only runs only: a TV series is promoted to HOT only if at least
  # this many episodes have been watched since the last full run. Filters out
  # single-pilot watches that shouldn't promote a whole series. Movies are not
  # affected. Ignored on full and demote-only runs. 1 disables the guard.
  min_episodes_for_fast_promote: 2
